<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>undercurrent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%8A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --ink-900: #1B2027;
    --ink-800: #232A33;
    --ink-700: #313A46;
    --ink-600: #4A5563;
    --paper: #ECE7DD;
    --paper-dim: #A6A093;
    --amber: #E3A34E;
    --violet: #9186C9;
    --sage: #7FAE8E;
    --rose: #C97B84;
    --slate: #6E8FB0;
    --font-serif: 'Newsreader', Georgia, serif;
    --font-sans: 'Manrope', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink-900);
    color: var(--paper);
    font-family: var(--font-sans);
    min-height: 100vh;
  }

  .hidden { display: none !important; }

  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  header.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 20px;
    margin-bottom: 32px;
    border-bottom: 1px solid var(--ink-700);
  }

  .wordmark {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 500;
    font-size: 1.3rem;
    color: var(--paper);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 22px;
  }

  nav.views {
    display: flex;
    gap: 20px;
  }

  .view-btn {
    background: none;
    border: none;
    color: var(--paper-dim);
    font-family: var(--font-sans);
    font-size: 0.9rem;
    font-weight: 600;
    padding: 4px 0;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }

  .view-btn[aria-current="page"] {
    color: var(--paper);
    border-bottom-color: var(--amber);
  }

  #logout-btn {
    background: none;
    border: none;
    color: var(--paper-dim);
    font-family: var(--font-sans);
    font-size: 0.85rem;
    cursor: pointer;
  }
  #logout-btn:hover { color: var(--rose); }

  .view { display: none; }
  .view.active { display: block; }

  .prompt {
    font-family: var(--font-serif);
    font-size: 1.5rem;
    font-weight: 500;
    margin: 0 0 16px;
    line-height: 1.3;
  }

  textarea#thought-input {
    width: 100%;
    min-height: 130px;
    background: var(--ink-800);
    border: 1px solid var(--ink-700);
    border-radius: 6px;
    color: var(--paper);
    font-family: var(--font-serif);
    font-size: 1.1rem;
    line-height: 1.6;
    padding: 14px;
    resize: vertical;
  }

  textarea#thought-input::placeholder { color: var(--ink-600); font-style: italic; }

  .field { margin-top: 22px; }

  .field-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--paper-dim);
    margin-bottom: 10px;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }

  .chip {
    background: transparent;
    border: 1px solid var(--ink-600);
    color: var(--paper-dim);
    font-family: var(--font-sans);
    font-size: 0.85rem;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
  }

  .chip[aria-pressed="true"] {
    color: var(--ink-900);
    border-color: transparent;
    font-weight: 600;
  }

  #custom-feeling-wrap {
    display: none;
    margin-top: 10px;
  }
  #custom-feeling-wrap.show { display: block; }

  .text-input {
    width: 100%;
    max-width: 320px;
    background: var(--ink-800);
    border: 1px solid var(--ink-700);
    border-radius: 6px;
    color: var(--paper);
    font-family: var(--font-sans);
    font-size: 0.95rem;
    padding: 10px 14px;
  }

  #like-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 1px solid var(--ink-600);
    color: var(--paper-dim);
    font-family: var(--font-sans);
    font-size: 0.9rem;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
  }

  #like-toggle[aria-pressed="true"] {
    border-color: var(--amber);
    color: var(--amber);
    background: rgba(227, 163, 78, 0.08);
  }

  .actions {
    display: flex;
    gap: 12px;
    margin-top: 28px;
  }

  button.primary, button.ghost {
    font-family: var(--font-sans);
    font-size: 0.95rem;
    font-weight: 600;
    padding: 10px 22px;
    border-radius: 6px;
    cursor: pointer;
  }

  button.primary {
    background: var(--amber);
    border: 1px solid var(--amber);
    color: var(--ink-900);
  }

  button.ghost {
    background: transparent;
    border: 1px solid var(--sage);
    color: var(--sage);
  }

  #write-form.releasing {
    transition: opacity 0.4s ease, transform 0.4s ease;
    opacity: 0;
    transform: translateY(6px);
  }
  @media (prefers-reduced-motion: reduce) {
    #write-form.releasing { transition: none; opacity: 1; transform: none; }
  }

  #form-message, #auth-message {
    min-height: 1.2em;
    font-size: 0.85rem;
    color: var(--paper-dim);
    margin-top: 14px;
  }

  .browse-header {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
  }

  #search-input {
    flex: 1;
    background: var(--ink-800);
    border: 1px solid var(--ink-700);
    border-radius: 6px;
    color: var(--paper);
    font-family: var(--font-sans);
    font-size: 0.95rem;
    padding: 10px 14px;
  }

  #export-btn {
    background: transparent;
    border: 1px solid var(--ink-600);
    color: var(--paper-dim);
    font-family: var(--font-sans);
    font-size: 0.85rem;
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
  }

  #filter-chips { margin-bottom: 24px; }

  .thought-item {
    border-bottom: 1px solid var(--ink-700);
    padding: 16px 0;
  }

  .thought-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .feeling-pill {
    font-size: 0.75rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid;
  }

  .thought-date {
    font-size: 0.8rem;
    color: var(--paper-dim);
  }

  .liked-mark { color: var(--amber); }

  .remove-btn {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--ink-600);
    font-size: 1.1rem;
    cursor: pointer;
    line-height: 1;
    padding: 2px 6px;
  }
  .remove-btn:hover { color: var(--rose); }

  .thought-text {
    font-family: var(--font-serif);
    font-size: 1.05rem;
    line-height: 1.6;
    margin: 0;
    white-space: pre-wrap;
  }

  .empty-state {
    color: var(--paper-dim);
    font-size: 0.95rem;
    padding: 24px 0;
  }

  .stats-row {
    display: flex;
    gap: 40px;
    margin-bottom: 36px;
  }

  .stat-number {
    font-family: var(--font-serif);
    font-size: 2.1rem;
    font-weight: 500;
  }

  .stat-label {
    font-size: 0.85rem;
    color: var(--paper-dim);
    margin-top: 2px;
  }

  .recent-flow { margin-bottom: 36px; }

  .recent-flow-dots {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .flow-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }

  .breakdown-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .breakdown-name {
    width: 110px;
    flex-shrink: 0;
    font-size: 0.9rem;
  }

  .breakdown-bar-track {
    flex: 1;
    background: var(--ink-800);
    border-radius: 4px;
    height: 10px;
    overflow: hidden;
  }

  .breakdown-bar-fill {
    height: 100%;
    border-radius: 4px;
  }

  .breakdown-count {
    width: 24px;
    text-align: right;
    font-size: 0.85rem;
    color: var(--paper-dim);
  }

  :focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  @media (max-width: 420px) {
    .wordmark { font-size: 1.1rem; }
    nav.views { gap: 14px; }
    .prompt { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<div class="container">
  <header class="top">
    <span class="wordmark">undercurrent</span>
    <div class="header-right">
      <nav class="views hidden" id="main-nav">
        <button class="view-btn" data-view="write" aria-current="page">Write</button>
        <button class="view-btn" data-view="browse">Browse</button>
        <button class="view-btn" data-view="patterns">Patterns</button>
      </nav>
      <button id="logout-btn" class="hidden">Log out</button>
    </div>
  </header>

  <main>
    <section id="view-auth" class="view active">
      <p class="prompt">Sign in to keep your thoughts in sync</p>
      <div class="field">
        <label class="field-label" for="auth-email">Email</label>
        <input type="email" id="auth-email" class="text-input" placeholder="you@example.com">
      </div>
      <div class="field">
        <label class="field-label" for="auth-password">Password</label>
        <input type="password" id="auth-password" class="text-input" placeholder="At least 6 characters">
      </div>
      <div class="actions">
        <button type="button" class="ghost" id="signup-btn">Create account</button>
        <button type="button" class="primary" id="login-btn">Log in</button>
      </div>
      <p id="auth-message"></p>
    </section>

    <section id="view-write" class="view">
      <form id="write-form">
        <p class="prompt">What's on your mind?</p>
        <label class="field-label" for="thought-input" style="position:absolute;left:-9999px;">Your thought</label>
        <textarea id="thought-input" placeholder="Start writing..."></textarea>

        <div class="field">
          <span class="field-label">What feeling is this closest to?</span>
          <div class="chips" id="feeling-chips">
            <button type="button" class="chip" data-feeling="Joy">Joy</button>
            <button type="button" class="chip" data-feeling="Calm">Calm</button>
            <button type="button" class="chip" data-feeling="Grateful">Grateful</button>
            <button type="button" class="chip" data-feeling="Hope">Hope</button>
            <button type="button" class="chip" data-feeling="Anxious">Anxious</button>
            <button type="button" class="chip" data-feeling="Sadness">Sadness</button>
            <button type="button" class="chip" data-feeling="Anger">Anger</button>
            <button type="button" class="chip" data-feeling="Frustration">Frustration</button>
            <button type="button" class="chip" data-feeling="Loneliness">Loneliness</button>
            <button type="button" class="chip" data-feeling="Excitement">Excitement</button>
            <button type="button" class="chip" data-feeling="__other__">Other...</button>
          </div>
          <div id="custom-feeling-wrap">
            <input type="text" id="custom-feeling" class="text-input" style="max-width:260px;" placeholder="Name the feeling">
          </div>
        </div>

        <div class="field">
          <span class="field-label">Do you like this thought?</span>
          <button type="button" id="like-toggle" aria-pressed="false">
            <span id="like-icon">♡</span>
            <span id="like-text">Not yet</span>
          </button>
        </div>

        <div class="actions">
          <button type="button" class="ghost" id="let-go-btn">Let it go</button>
          <button type="button" class="primary" id="keep-btn">Keep it</button>
        </div>
        <p id="form-message"></p>
      </form>
    </section>

    <section id="view-browse" class="view">
      <div class="browse-header">
        <input type="text" id="search-input" placeholder="Search your thoughts...">
        <button id="export-btn">Export CSV</button>
      </div>
      <div class="chips" id="filter-chips"></div>
      <div id="thought-list"></div>
    </section>

    <section id="view-patterns" class="view">
      <div id="patterns-content"></div>
    </section>
  </main>
</div>

<script>
  // ---- Supabase setup ----
  // 1. Create a free project at supabase.com
  // 2. In the SQL Editor, run:
  //
  //   create extension if not exists "pgcrypto";
  //
  //   create table thoughts (
  //     id uuid primary key default gen_random_uuid(),
  //     user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
  //     text text not null,
  //     feeling text not null,
  //     liked boolean not null default false,
  //     created_at timestamptz not null default now()
  //   );
  //
  //   alter table thoughts enable row level security;
  //
  //   create policy "individuals manage own thoughts"
  //   on thoughts for all
  //   using (auth.uid() = user_id)
  //   with check (auth.uid() = user_id);
  //
  // 3. In Project Settings -> API, copy the Project URL and anon public key below.
  const SUPABASE_URL = 'YOUR_SUPABASE_URL';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const PRESET_FEELINGS = ['Joy','Calm','Grateful','Hope','Anxious','Sadness','Anger','Frustration','Loneliness','Excitement'];
  const PALETTE = ['#E3A34E','#9186C9','#7FAE8E','#C97B84','#6E8FB0'];

  let thoughts = [];
  let currentUser = null;

  function colorFor(feeling) {
    let hash = 0;
    for (let i = 0; i < feeling.length; i++) hash = feeling.charCodeAt(i) + ((hash << 5) - hash);
    return PALETTE[Math.abs(hash) % PALETTE.length];
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }

  // ---- Auth ----
  const authEmail = document.getElementById('auth-email');
  const authPassword = document.getElementById('auth-password');
  const authMessage = document.getElementById('auth-message');

  function showAuthMessage(text) { authMessage.textContent = text; }

  function showAuth() {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-auth').classList.add('active');
    document.getElementById('main-nav').classList.add('hidden');
    document.getElementById('logout-btn').classList.add('hidden');
  }

  function showApp() {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-write').classList.add('active');
    document.querySelectorAll('.view-btn').forEach(b => {
      if (b.dataset.view === 'write') b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    document.getElementById('main-nav').classList.remove('hidden');
    document.getElementById('logout-btn').classList.remove('hidden');
    loadThoughts();
  }

  document.getElementById('signup-btn').addEventListener('click', async () => {
    const email = authEmail.value.trim();
    const password = authPassword.value;
    if (!email || password.length < 6) { showAuthMessage('Enter an email and a password of at least 6 characters.'); return; }
    const { error } = await sb.auth.signUp({ email, password });
    if (error) showAuthMessage(error.message);
    else showAuthMessage('Check your email to confirm your account, then log in.');
  });

  document.getElementById('login-btn').addEventListener('click', async () => {
    const email = authEmail.value.trim();
    const password = authPassword.value;
    if (!email || !password) { showAuthMessage('Enter your email and password.'); return; }
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) showAuthMessage(error.message);
  });

  authPassword.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('login-btn').click();
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await sb.auth.signOut();
  });

  sb.auth.onAuthStateChange((event, session) => {
    if (session && session.user) {
      currentUser = session.user;
      showApp();
    } else {
      currentUser = null;
      showAuth();
    }
  });

  // ---- View switching ----
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => switchView(btn.dataset.view));
  });

  function switchView(view) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + view).classList.add('active');
    document.querySelectorAll('.view-btn').forEach(b => {
      if (b.dataset.view === view) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    if (view === 'browse') renderBrowse();
    if (view === 'patterns') renderPatterns();
  }

  // ---- Write form ----
  const feelingChips = document.getElementById('feeling-chips');
  const customWrap = document.getElementById('custom-feeling-wrap');
  const customInput = document.getElementById('custom-feeling');
  let selectedFeeling = null;
  let liked = false;

  feelingChips.addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    const value = btn.dataset.feeling;
    feelingChips.querySelectorAll('.chip').forEach(c => {
      c.setAttribute('aria-pressed', 'false');
      c.style.background = 'transparent';
      c.style.borderColor = 'var(--ink-600)';
      c.style.color = 'var(--paper-dim)';
    });
    btn.setAttribute('aria-pressed', 'true');
    const color = value === '__other__' ? '#E3A34E' : colorFor(value);
    btn.style.background = color;
    btn.style.color = '#1B2027';
    selectedFeeling = value;
    if (value === '__other__') {
      customWrap.classList.add('show');
      customInput.focus();
    } else {
      customWrap.classList.remove('show');
    }
  });

  const likeToggle = document.getElementById('like-toggle');
  const likeIcon = document.getElementById('like-icon');
  const likeText = document.getElementById('like-text');
  likeToggle.addEventListener('click', () => {
    liked = !liked;
    likeToggle.setAttribute('aria-pressed', String(liked));
    likeIcon.textContent = liked ? '♥' : '♡';
    likeText.textContent = liked ? 'Yes, I like it' : 'Not yet';
  });

  const thoughtInput = document.getElementById('thought-input');
  const formMessage = document.getElementById('form-message');
  const writeForm = document.getElementById('write-form');

  function showMessage(text) {
    formMessage.textContent = text;
    setTimeout(() => { if (formMessage.textContent === text) formMessage.textContent = ''; }, 2600);
  }

  function currentFeelingValue() {
    if (selectedFeeling === '__other__') return customInput.value.trim();
    return selectedFeeling;
  }

  function resetForm() {
    thoughtInput.value = '';
    selectedFeeling = null;
    liked = false;
    customInput.value = '';
    customWrap.classList.remove('show');
    feelingChips.querySelectorAll('.chip').forEach(c => {
      c.setAttribute('aria-pressed', 'false');
      c.style.background = 'transparent';
      c.style.borderColor = 'var(--ink-600)';
      c.style.color = 'var(--paper-dim)';
    });
    likeToggle.setAttribute('aria-pressed', 'false');
    likeIcon.textContent = '♡';
    likeText.textContent = 'Not yet';
  }

  document.getElementById('keep-btn').addEventListener('click', async () => {
    const text = thoughtInput.value.trim();
    const feeling = currentFeelingValue();
    if (!text) { showMessage('Write something first.'); return; }
    if (!feeling) { showMessage('Choose a feeling first.'); return; }
    const { data, error } = await sb.from('thoughts').insert({ text, feeling, liked }).select().single();
    if (error) { showMessage('Could not save: ' + error.message); return; }
    thoughts.unshift({ id: data.id, text: data.text, feeling: data.feeling, liked: data.liked, createdAt: data.created_at });
    resetForm();
    showMessage('Kept.');
  });

  document.getElementById('let-go-btn').addEventListener('click', () => {
    const text = thoughtInput.value.trim();
    if (!text) { showMessage('Nothing to let go of yet.'); return; }
    writeForm.classList.add('releasing');
    setTimeout(() => {
      resetForm();
      writeForm.classList.remove('releasing');
      showMessage('Released. Not saved.');
    }, 420);
  });

  // ---- Data ----
  async function loadThoughts() {
    const { data, error } = await sb.from('thoughts').select('*').order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    thoughts = data.map(row => ({ id: row.id, text: row.text, feeling: row.feeling, liked: row.liked, createdAt: row.created_at }));
    if (document.getElementById('view-browse').classList.contains('active')) renderBrowse();
    if (document.getElementById('view-patterns').classList.contains('active')) renderPatterns();
  }

  // ---- Browse ----
  const filterChipsEl = document.getElementById('filter-chips');
  const thoughtListEl = document.getElementById('thought-list');
  const searchInput = document.getElementById('search-input');
  let filterFeelings = new Set();
  let filterLikedOnly = false;
  let searchTerm = '';

  searchInput.addEventListener('input', () => {
    searchTerm = searchInput.value.trim().toLowerCase();
    renderThoughtList();
  });

  document.getElementById('export-btn').addEventListener('click', exportCSV);

  function renderBrowse() {
    const feelingsInUse = Array.from(new Set(thoughts.map(t => t.feeling)));
    filterChipsEl.innerHTML = feelingsInUse.map(f => {
      const active = filterFeelings.has(f);
      const color = colorFor(f);
      return `<button type="button" class="chip filter-chip" data-feeling="${escapeHtml(f)}"
        aria-pressed="${active}"
        style="${active ? `background:${color};color:#1B2027;` : ''}">${escapeHtml(f)}</button>`;
    }).join('') + `<button type="button" class="chip filter-chip" id="liked-only-chip"
        aria-pressed="${filterLikedOnly}"
        style="${filterLikedOnly ? 'background:var(--amber);color:#1B2027;' : ''}">♥ Liked only</button>`;

    filterChipsEl.querySelectorAll('.filter-chip[data-feeling]').forEach(chip => {
      chip.addEventListener('click', () => {
        const f = chip.dataset.feeling;
        if (filterFeelings.has(f)) filterFeelings.delete(f); else filterFeelings.add(f);
        renderBrowse();
      });
    });
    const likedChip = document.getElementById('liked-only-chip');
    if (likedChip) likedChip.addEventListener('click', () => { filterLikedOnly = !filterLikedOnly; renderBrowse(); });

    renderThoughtList();
  }

  function renderThoughtList() {
    let list = thoughts.slice();
    if (filterFeelings.size) list = list.filter(t => filterFeelings.has(t.feeling));
    if (filterLikedOnly) list = list.filter(t => t.liked);
    if (searchTerm) list = list.filter(t => t.text.toLowerCase().includes(searchTerm));

    if (thoughts.length === 0) {
      thoughtListEl.innerHTML = '<p class="empty-state">Nothing kept yet. Thoughts you decide to keep will show up here.</p>';
      return;
    }
    if (list.length === 0) {
      thoughtListEl.innerHTML = '<p class="empty-state">No thoughts match that search.</p>';
      return;
    }

    thoughtListEl.innerHTML = list.map(t => {
      const color = colorFor(t.feeling);
      return `<article class="thought-item" data-id="${t.id}">
        <div class="thought-meta">
          <span class="feeling-pill" style="border-color:${color};color:${color}">${escapeHtml(t.feeling)}</span>
          <span class="thought-date">${formatDate(t.createdAt)}</span>
          ${t.liked ? '<span class="liked-mark" title="Liked">♥</span>' : ''}
          <button class="remove-btn" title="Remove" data-id="${t.id}">×</button>
        </div>
        <p class="thought-text">${escapeHtml(t.text)}</p>
      </article>`;
    }).join('');

    thoughtListEl.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const { error } = await sb.from('thoughts').delete().eq('id', id);
        if (error) { console.error(error); return; }
        thoughts = thoughts.filter(t => t.id !== id);
        renderBrowse();
      });
    });
  }

  function exportCSV() {
    const header = ['date', 'feeling', 'liked', 'text'];
    const rows = thoughts.map(t => [t.createdAt, t.feeling, t.liked ? 'yes' : 'no', t.text.replace(/"/g, '""')]);
    const csv = [header, ...rows].map(r => r.map(f => `"${f}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'undercurrent-thoughts.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  // ---- Patterns ----
  function renderPatterns() {
    const el = document.getElementById('patterns-content');
    if (thoughts.length === 0) {
      el.innerHTML = '<p class="empty-state">Patterns will appear once you\'ve kept a few thoughts.</p>';
      return;
    }
    const likedCount = thoughts.filter(t => t.liked).length;
    const likedPct = Math.round((likedCount / thoughts.length) * 100);

    const counts = {};
    thoughts.forEach(t => { counts[t.feeling] = (counts[t.feeling] || 0) + 1; });
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const max = sorted[0][1];

    const recent = thoughts.slice(0, 8).slice().reverse();

    el.innerHTML = `
      <div class="stats-row">
        <div class="stat">
          <div class="stat-number">${thoughts.length}</div>
          <div class="stat-label">thoughts kept</div>
        </div>
        <div class="stat">
          <div class="stat-number">${likedPct}%</div>
          <div class="stat-label">liked</div>
        </div>
      </div>
      <div class="recent-flow">
        <span class="field-label">Recent flow</span>
        <div class="recent-flow-dots">
          ${recent.map(t => `<span class="flow-dot" style="background:${colorFor(t.feeling)}" title="${escapeHtml(t.feeling)} on ${formatDate(t.createdAt)}"></span>`).join('')}
        </div>
      </div>
      <div>
        <span class="field-label">Feelings, most to least common</span>
        ${sorted.map(([name, count]) => `
          <div class="breakdown-row">
            <span class="breakdown-name">${escapeHtml(name)}</span>
            <div class="breakdown-bar-track"><div class="breakdown-bar-fill" style="width:${(count / max) * 100}%;background:${colorFor(name)}"></div></div>
            <span class="breakdown-count">${count}</span>
          </div>`).join('')}
      </div>
    `;
  }

  // ---- Init ----
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session && session.user) {
      currentUser = session.user;
      showApp();
    } else {
      showAuth();
    }
  })();
</script>

</body>
</html>
